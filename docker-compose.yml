# One host, one app, one database.
#
# There is no Redis here any more. It existed to carry pub/sub between four
# Node services; with one process there is nothing to publish between, and a
# broker that exists to talk to yourself is a dependency with no job.
#
# Ports are deliberately off the defaults so this cannot collide with a
# Postgres already running on the host.
#
# Nothing is mounted into /docker-entrypoint-initdb.d. That hook runs ONCE, on
# an empty volume, and never again — a bootstrap, not a migration system. The
# schema now lives in db/migrations and is applied by `pnpm run db:setup`,
# which can also migrate a database that already has data in it.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sbb_fundbuero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sbb_fundbuero']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
