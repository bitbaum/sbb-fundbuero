name: CI

# One app, one install, one gate. `pnpm run verify` (package.json) is the single
# source of truth for what "green" means, and this workflow calls it verbatim so
# green locally is green here. Do not inline a check that is not in `verify` —
# a check nobody can run before pushing is a check that only fails after
# pushing.

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Verify (format + lint + typecheck + test + tenant SSOT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify
